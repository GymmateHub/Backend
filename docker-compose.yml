# Local stack: backend + PostgreSQL 18 + Redis.
#   docker compose up --build
# Override any value with a .env file next to this compose file (see .env.example).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gymmate
      POSTGRES_USER: ${PG_USER:-gymmate}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-gymmate_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-gymmate} -d gymmate"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gymmate-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gymmate-network

  gymmate-backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PG_URI: jdbc:postgresql://postgres:5432/gymmate
      PG_USER: ${PG_USER:-gymmate}
      PG_PASSWORD: ${PG_PASSWORD:-gymmate_password}
      FLYWAY_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@gymmate.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-ChangeMe!12345}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gymmate-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:

networks:
  gymmate-network:
    driver: bridge
