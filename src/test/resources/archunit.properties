# ArchUnit configuration (see com.gymmate.architecture.CleanArchitectureTest)
# Frozen-rule violation baseline, committed to git so debt reduction is reviewable.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
# Several target-state packages (e.g. ..internal.infrastructure.persistence..) are empty
# until the corresponding refactor phase lands.
archRule.failOnEmptyShould=false
