# ============================================
# GymMate SMTP Configuration - All Email Accounts
# ============================================

spring:
  mail:
    host: ${MAIL_HOST:premium700.web-hosting.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@gymmatehub.com}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@gymmatehub.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:premium700.web-hosting.com}
        transport:
          protocol: smtp
        debug: false
    default-encoding: UTF-8
    test-connection: false

# ============================================
# Application Email Configuration
# ============================================
app:
  email:
    # Main transactional email (noreply)
    from:
      address: ${MAIL_FROM:noreply@gymmatehub.com}
      name: GymMateHub

    # Support team email
    support:
      address: support@gymmatehub.com
      name: GymMateHub Support
      password: ${MAIL_SUPPORT_PASSWORD:}

    # Admin team email
    admin:
      address: admin@gymmatehub.com
      name: GymMateHub Admin
      password: ${MAIL_ADMIN_PASSWORD:}

    templates:
      base-path: classpath:/templates/email/

    retry:
      max-attempts: 3
      backoff-delay: 2000

    rate-limit:
      enabled: true
      max-per-minute: 60
      max-per-hour: 1000

# ============================================
# Environment-specific overrides
# ============================================
---
# Development - Uses Mailtrap by default for local testing
spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: ${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAILTRAP_PORT:2525}
    username: ${MAILTRAP_USERNAME:74f485d35b9e56}
    password: ${MAILTRAP_PASSWORD:1bab170254a5de}
    from: ${MAIL_FROM:noreply@gymmatehub.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            trust: "*"
        transport:
          protocol: smtp
        debug: true
    test-connection: false

management:
  health:
    mail:
      enabled: false

---
# Production / Server (AWS SES SMTP)
spring:
  config:
    activate:
      on-profile: prod | production
  mail:
    host: ${SES_SMTP_HOST:${MAIL_HOST:email-smtp.us-east-2.amazonaws.com}}
    port: ${SES_SMTP_PORT:${MAIL_PORT:587}}
    username: ${SES_SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${SES_SMTP_PASSWORD:${MAIL_PASSWORD:}}
    from: ${MAIL_FROM:noreply@gymmatehub.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${SES_SMTP_HOST:${MAIL_HOST:email-smtp.us-east-2.amazonaws.com}}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false
    test-connection: false

app:
  email:
    ses-tenant: ${SES_TENANT:gymmatehub}
    configuration-set: ${SES_CONFIGURATION_SET:gymmatehub-transactional}

management:
  health:
    mail:
      enabled: false

# Enable debug logging for troubleshooting
logging:
  level:
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG
